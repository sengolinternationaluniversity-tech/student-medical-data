<script>
const HEADERS=["S.No.","Year","State","Inst. Type","Institute Name","Location","Estd.","Course Name","Category","Closing Rank","Closing Score","Round","Annual Fee (₹)","Other Fee (₹)","Total Fee (₹)","Fee 1st year pa","NRI Fee (₹)","Domicile"];
const DB_NAME="StudentMedicalDataHTMLOnly",STORE="records",DB_VERSION=1;
let data=[],editIndex=-1;
let filters={state:[],type:[],category:[],round:[],domicile:[],institute:[],location:"",course:""};
let selectedRows=new Set();
let closingRankSort="";
// Filter columns use canonical 18-field rows: S.No=0, Year=1, State=2, Inst.Type=3, Institute=4, Location=5, Estd=6, Course=7, Category=8, Rank=9, Score=10, Round=11.
const cfg={
 stateMenu:{col:2,label:"All States",multi:true,key:"state"},
 typeMenu:{col:3,label:"All Types",multi:true,key:"type"},
 instituteMenu:{col:4,label:"All Institutes",multi:true,key:"institute"},
 locationMenu:{col:5,label:"All Locations",multi:false,key:"location"},
 courseMenu:{col:7,label:"All Courses",multi:false,key:"course"},
 categoryMenu:{col:8,label:"All Categories",multi:true,key:"category"},
 roundMenu:{col:11,label:"All Rounds",multi:true,key:"round"},
 domicileMenu:{col:17,label:"All Domiciles",multi:true,key:"domicile"}
};
const SUPABASE_URL="https://tyjdyntcbwsikhcafkhj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_WhR0Jef1IvrkbSgq2ymbqw_F_qZpF1M";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null;
let currentRole="viewer";
const ADMIN_EMAIL="medicaladmin@gmail.com";

async function initAuth(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session?.user){
    showApp(session.user);
  }else{
    showLogin();
  }
  supabaseClient.auth.onAuthStateChange((_event,session)=>{
    if(session?.user) showApp(session.user); else showLogin();
  });
}
function showLogin(){
  currentUser=null;
  const l=document.getElementById("loginScreen"),a=document.getElementById("appShell");
  if(l)l.style.display="flex";
  if(a)a.style.display="none";
}
function showApp(user){
  currentUser=user;
  currentRole=(String(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase())?"admin":"viewer";
  const l=document.getElementById("loginScreen"),a=document.getElementById("appShell");
  if(l)l.style.display="none";
  if(a)a.style.display="block";
  const e=document.getElementById("authEmail"); if(e)e.textContent=user.email||"";
  const role=document.getElementById("authRole"); if(role)role.textContent=currentRole==="admin"?"ADMIN":"VIEW ONLY";
  applyRoleUI();
  loadDB();
}
function applyRoleUI(){
  const isAdmin=currentRole==="admin";

  // Admin-only controls
  ["addRecordBtn","importExcelBtn","downloadTemplateBtn","resetFiltersBtn","bulkBar"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=isAdmin?"":"none";
  });

  // Export All Excel is also admin-only. Excel/PDF download buttons in the
  // top Download area remain available to viewers.
  const exportAll=document.getElementById("exportAllExcelBtn");
  if(exportAll) exportAll.style.display=isAdmin?"":"none";

  // Hide the Action column and row edit/delete controls for viewers.
  const table=document.getElementById("dataTable");
  if(table) table.classList.toggle("viewer-mode",!isAdmin);

  // Defensive hiding by onclick for any action button that may have no ID.
  document.querySelectorAll('button[onclick="openAdd()"],button[onclick="downloadTemplate()"],button[onclick="resetFilters()"],button[onclick="deleteSelectedRows()"]').forEach(el=>{
    el.style.display=isAdmin?"":"none";
  });

  // Never hide Excel/PDF download controls for viewers.
  document.querySelectorAll('[data-viewer-download]').forEach(el=>el.style.display="");
}

async function loginUser(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const err=document.getElementById("loginError");
  if(!email||!password){err.textContent="Email and password are required.";return}
  err.textContent="Signing in...";
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)err.textContent=error.message; else err.textContent="";
}
async function logoutUser(){
  await supabaseClient.auth.signOut();
}


function rowToObject(r){

  return {s_no:x[0]??"",year:x[1]??"",state:x[2]??"",inst_type:x[3]??"",institute_name:x[4]??"",location:x[5]??"",estd:x[6]??"",course_name:x[7]??"",category:x[8]??"",closing_rank:num(x[9]),closing_score:num(x[10]),round:x[11]??"",annual_fee:String(x[12]??""),other_fee:String(x[13]??""),total_fee:String(x[14]??""),fee_1st_year_pa:String(x[15]??""),nri_fee:String(x[16]??""),domicile:x[17]??""};
}
function sentenceCase(v){
  const s=String(v??"").trim();
  if(!s)return "";
  return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
}
function canonicalInstituteType(v){
  const s=String(v??"").trim();
  if(/^(govt\\.?|government)$/i.test(s)) return "Govt.";
  return sentenceCase(s);
}
function normalizeRow(r){
  let x=Array.isArray(r)?r.slice():[];
  // Canonical in-memory format is always 18 fields:
  // S.No, Year, State, Inst.Type, Institute Name, Location, Estd.,
  // Course Name, Category, Closing Rank, Closing Score, Round,
  // Annual Fee, Other Fee, Total Fee, Fee 1st year pa, NRI Fee, Domicile.
  if(x.length===17) x=["",...x];
  while(x.length<18)x.push("");
  if(x.length>18)x=x.slice(0,18);
  x[3]=canonicalInstituteType(x[3]);
  return x;
}

function objectToRow(o){
 const a=[o.s_no??"",o.year??"",o.state??"",o.inst_type??"",o.institute_name??"",o.location??"",o.estd??"",o.course_name??"",o.category??"",o.closing_rank??"",o.closing_score??"",o.round??"",o.annual_fee??"",o.other_fee??"",o.total_fee??"",o.fee_1st_year_pa??"",o.nri_fee??"",o.domicile??""];
 const looksLikeYear=v=>/^20\\d{2}$/.test(String(v??"").trim());
 const looksLikeState=v=>/^[A-Za-z]{2,3}$/.test(String(v??"").trim());
 if(looksLikeYear(a[0]) && looksLikeState(a[1])){
   return ["",a[0],a[1],a[2],a[3],a[4],a[5],a[6],a[7],a[8],a[9],a[10],a[11],a[12],a[13],a[14],a[15],a[16]];
 }
 a[3]=canonicalInstituteType(a[3]);
  return a;
}

async function getSupabaseRows(){
 const PAGE=1000;
 let all=[];
 for(let from=0;;from+=PAGE){
   const {data:rows,error}=await supabaseClient.from("medical_data").select("*").range(from,from+PAGE-1);
   if(error)throw error;
   const page=rows||[];
   all=all.concat(page);
   if(page.length<PAGE)break;
 }
 return all.map(objectToRow).map(normalizeRow);
}
async function uploadRows(rows){
 if(!rows.length)return;
 // Supabase/PostgREST commonly caps a single response/request at 1000 rows.
 // Insert in batches so imports/saves can safely handle more than 1000 records.
 const BATCH=500;
 for(let i=0;i<rows.length;i+=BATCH){
   const batch=rows.slice(i,i+BATCH).map(rowToObject);
   const {error}=await supabaseClient.from("medical_data").insert(batch);
   if(error)throw error;
 }
}
async function replaceSupabaseRows(rows){
 const {error}=await supabaseClient.from("medical_data").delete().not("id","is",null);
 if(error)throw error;
 await uploadRows(rows);
}
async function syncCurrentData(){
 await replaceSupabaseRows(data);
 await replaceDB();
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(v){return String(v??"").trim().toLowerCase()}
function num(v){
  const s=String(v??"").trim();
  if(!s)return null;
  const cleaned=s.replace(/[₹,\s,]/g,"").replace(/\+$/,"");
  const m=cleaned.match(/-?\d+(?:\.\d+)?/);
  if(!m)return null;
  const n=Number(m[0]);
  return Number.isFinite(n)?n:null;
}

function toggleAllFilter(id,on){
 const c=cfg[id];
 if(!c||!c.multi)return;
 // Checking All selects every option; unchecking All clears every option.

}

function setOneFilter(id,v,on){
 const c=cfg[id];
 if(!c||!c.multi)return;

 let a=Array.isArray(filters[c.key])?filters[c.key].slice():[];

 // If the previous state was ALL, start with every option, then remove
 // the one the user just unchecked.
 const opts=optionValues(c.col,c.key).map(x=>norm(c.col===3?canonicalInstituteType(x):x));

 if(a.length===0){
   a=opts.slice();
 }
 if(a.length===1 && a[0]==="__NONE__"){
   a=[];
 }

 if(on){
   if(!a.includes(v))a.push(v);
 }else{
   a=a.filter(x=>x!==v);
 }

 // Every option selected = ALL.
 if(opts.length && opts.every(x=>a.includes(x))) a=[];

 // No option selected = NONE.
 if(a.length===0 && !opts.every(x=>a.includes(x))) a=["__NONE__"];

 filters[c.key]=a;
 setupMenu(id);
 render();
 document.getElementById(id).classList.add("show");
}

 const rank=num(document.getElementById("rank").value);
 const score=num(document.getElementById("score").value);
 let rows=data.map((raw,i)=>({r:normalizeRow(raw),i})).filter(x=>{

    &&(!filters.location||norm(r[5])===norm(filters.location))
    &&(!filters.course||norm(r[7])===norm(filters.course))
    &&(!filters.category.length || (filters.category[0]!=="__NONE__" && filters.category.includes(norm(r[8]))))
    &&(!filters.round.length || (filters.round[0]!=="__NONE__" && filters.round.includes(norm(r[11]))))
    &&rankPasses(r[9],rank)
    &&(score===null||(ss!==null&&ss<=score));
 });
 const fs=document.getElementById("feeSort").value;
 if(fs)rows.sort((a,b)=>{
   const av=num(a.r[14]),bv=num(b.r[14]);
   const aa=av===null?Infinity:av,bb=bv===null?Infinity:bv;
   return (aa-bb)*(fs==="asc"?1:-1);
 });

function sortClosingRank(order){
  closingRankSort = (closingRankSort===order) ? "" : order;
  render();
  const a=document.getElementById("rankAscBtn");
  const d=document.getElementById("rankDescBtn");
  if(a)a.classList.toggle("green",closingRankSort==="asc");
  if(d)d.classList.toggle("green",closingRankSort==="desc");
}

function rankPasses(closingRank, minimumRank){
  if(minimumRank===null)return true;
  const r=num(closingRank);
  return r!==null && r>=minimumRank;
}

function render(){
  const y=norm(document.getElementById("year").value);
  const rank=num(document.getElementById("rank").value);
  const score=num(document.getElementById("score").value);

  let rows=data.map((raw,i)=>({r:normalizeRow(raw),i})).filter(x=>{
    const r=x.r;
    const rr=num(r[9]), ss=num(r[10]);
    return (!y||norm(r[1])===y)
     &&(!filters.state.length || (filters.state[0]!=="__NONE__" && filters.state.includes(norm(r[2]))))
     &&(!filters.type.length || (filters.type[0]!=="__NONE__" && filters.type.includes(norm(canonicalInstituteType(r[3])))))
     &&(!filters.institute.length || (filters.institute[0]!=="__NONE__" && filters.institute.includes(norm(r[4]))))
     &&(!filters.location||norm(r[5])===norm(filters.location))
     &&(!filters.course||norm(r[7])===norm(filters.course))
     &&(!filters.category.length || (filters.category[0]!=="__NONE__" && filters.category.includes(norm(r[8]))))
     &&(!filters.round.length || (filters.round[0]!=="__NONE__" && filters.round.includes(norm(r[11]))))
     &&(!filters.domicile.length || (filters.domicile[0]!=="__NONE__" && filters.domicile.includes(norm(r[17]))))
     &&rankPasses(r[9],rank)
     &&(score===null||(ss!==null&&ss<=score));
  });

  // Closing Rank sorting. This is applied AFTER the filter.
  if(closingRankSort==="asc"){
    rows.sort((a,b)=>{
      const av=num(a.r[9]), bv=num(b.r[9]);
      if(av===null) return 1;
      if(bv===null) return -1;
      return av-bv;
    });
  }else if(closingRankSort==="desc"){
    rows.sort((a,b)=>{
      const av=num(a.r[9]), bv=num(b.r[9]);
      if(av===null) return 1;
      if(bv===null) return -1;
      return bv-av;
    });
  }

  // Fee sorting only when selected.
  const fs=document.getElementById("feeSort").value;
  if(fs)rows.sort((a,b)=>{
    const av=num(a.r[14]),bv=num(b.r[14]);
    const aa=av===null?Infinity:av,bb=bv===null?Infinity:bv;
    return (aa-bb)*(fs==="asc"?1:-1);
  });

  document.getElementById("total").textContent=data.length;
  document.getElementById("states").textContent=new Set(data.map(r=>norm(r[2])).filter(Boolean)).size;
  document.getElementById("institutes").textContent=new Set(data.map(r=>norm(r[4])).filter(Boolean)).size;
  document.getElementById("courses").textContent=new Set(data.map(r=>norm(r[7])).filter(Boolean)).size;

  const year=document.getElementById("year"),oldYear=y;
  year.innerHTML='<option value="">All Years</option>'+unique(1).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  year.value=[...year.options].some(o=>norm(o.value)===oldYear)?oldYear:"";

  document.getElementById("thead").innerHTML=(currentRole==="admin"?`<th class="select-col"><input id="headerSelectAll" type="checkbox" onchange="toggleSelectAll(this.checked)"></th>`:"")+HEADERS.map((h,i)=>`<th class="${h==="Domicile"?"domicile-col":""}">${esc(h)}</th>`).join("")+`<th class="action-col">Action</th>`;
  document.getElementById("tbody").innerHTML=rows.map(x=>{
    const r=normalizeRow(x.r);
    const checked=selectedRows.has(x.i)?"checked":"";
    return `<tr>${currentRole==="admin"?`<td class="select-col"><input type="checkbox" ${checked} onchange="toggleRowSelect(${x.i},this.checked)"></td>`:""}`+
    `<td>${x.i+1}</td>`+
    r.slice(1,18).map((v,idx)=>`<td class="${idx===16?"domicile-col":""}">${esc(v)}</td>`).join("")+
    `<td class="action-col">${currentRole==="admin"?`<div class="row-actions"><button type="button" class="blue icon-btn" title="Edit" onclick="openEdit(${x.i})">✎</button><button type="button" class="red icon-btn" title="Delete" onclick="deleteRow(${x.i})">🗑</button></div>`:""}</td></tr>`;
  }).join("");
  updateSelectionUI(rows.map(x=>x.i));
  status(`Showing ${rows.length} of ${data.length} records`);
}

function clean(r){
 r=r.slice(0,17);while(r.length<17)r.push("");
 return r.map((v,i)=>{
   const value=String(v??"").trim();
   if(i===2 || i===3 || i===4 || i===5 || i===10) return i===10 ? (value===""?"":(num(value)??value)) : sentenceCase(value);
   if(i===9) return value===""?"":(num(value)??value);
   // Fee fields are deliberately kept exactly as entered/imported.
   if(i===11 || i===12 || i===13 || i===14 || i===15) return value;
   return value;
 });
}

   let x=margin;
   HEADERS.forEach((h,i)=>{doc.rect(x,y,ws[i],8);doc.text(String(h),x+1,y+3,{maxWidth:ws[i]-2});x+=ws[i]});
   y+=8;
 }
 function drawPageFooter(){
   doc.setFontSize(7);doc.setFont(undefined,"normal");
   doc.text(`Page ${page}`,pageW-margin, pageH-5,{align:"right"});
 }
 drawHeader();
 rows.forEach((item,ri)=>{
   const vals=[ri+1,...normalizeRow(item.r).slice(1)].map(v=>String(v??""));
   const lineH=7;
   if(y+lineH>pageH-10){drawPageFooter();doc.addPage();page++;y=15;drawHeader()}
   let x=margin;doc.setFontSize(5.5);doc.setFont(undefined,"normal");
   vals.forEach((v,i)=>{
     doc.rect(x,y,ws[i],lineH);
     const words=v.split(/\s+/);let line="",lines=[];
     words.forEach(word=>{
       const test=line?line+" "+word:word;
       if(doc.getTextWidth(test)>ws[i]-2){if(line)lines.push(line);line=word}else line=test;
     });
     if(line)lines.push(line);
     lines.slice(0,2).forEach((ln,n)=>doc.text(ln,x+1,y+3+n*2.5,{maxWidth:ws[i]-2}));
     x+=ws[i];
   });
   y+=lineH;
 });
 drawPageFooter();
 doc.save("Student_Medical_Data_Filtered.pdf");
 status(`Filtered PDF downloaded • ${rows.length} records`);
}

async function importExcel(e){
 if(currentRole!=="admin"){alert("View-only account: editing is not allowed.");return}
 const f=e.target.files[0];if(!f)return;
 try{
  if(typeof XLSX==="undefined")throw new Error("Excel module load nahi hua. Internet ON karke page refresh karein.");
  status("Importing Excel...");
  const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:"array",cellText:true,cellDates:false}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
  if(!rows.length)throw new Error("Excel file empty hai.");
  const cleanH=v=>norm(v).replace(/₹/g,"").replace(/[()._-]/g,"").replace(/\s+/g,"");
  const aliases={
   0:["year"],1:["state"],2:["insttype","institutetype"],3:["institutename","collegename"],
   4:["location","city"],5:["estd","established"],6:["coursename","course"],7:["category"],
   8:["closingrank","rank"],9:["closingscore","score"],10:["round"],11:["annualfee"],
   12:["otherfee"],13:["totalfee"],14:["fee1styearpa","fee1styear","firstyearfee"],15:["nrifee"],16:["domicile","domicilestate"]
  };
  let hi=-1,map=Array(17).fill(-1);
  for(let i=0;i<Math.min(rows.length,15);i++){
   const hs=rows[i].map(cleanH);
   if(hs.includes("year")&&hs.some(x=>x==="institutename")&&hs.some(x=>x==="coursename")){
    hi=i;
    Object.keys(aliases).forEach(j=>{map[j]=hs.findIndex(x=>aliases[j].includes(x))});
    break;
   }
  }
  if(hi<0){hi=0;if(rows[0].length>=18)for(let j=0;j<17;j++)map[j]=j+1;else if(rows[0].length>=17)for(let j=0;j<17;j++)map[j]=j;else throw new Error("17/18 columns nahi mile.");}
  let added=0,skipped=0,empty=0;
  const duplicateRows=[];
  for(let i=hi+1;i<rows.length;i++){
   let r=clean(map.map(k=>k>=0?rows[i][k]:""));
    r[1]=sentenceCase(r[1]);      // State
    r[2]=canonicalInstituteType(r[2]); // Inst. Type
    r[3]=sentenceCase(r[3]);      // Institute Name
    r[4]=sentenceCase(r[4]);      // Location
    r[10]=sentenceCase(r[10]);    // Round
   if(!r.some(v=>String(v).trim())){empty++;continue}
   const duplicateKey = r.slice(0,10).map(norm).join("|");
   const dup = data.some(x=>x.slice(0,10).map(norm).join("|")===duplicateKey);
   if(dup){
     skipped++;
     duplicateRows.push(r);
     continue;
   }
   data.push(normalizeRow([data.length+1,...r]));added++;
  }
  if(added) await uploadRows(data.slice(data.length-added));
   await replaceDB();refreshMenus();render();
  status(`Import successful • ${added} added • ${skipped} duplicates`);
  if(duplicateRows.length){
    const dupRows=[HEADERS,...duplicateRows.map((r,i)=>[i+1,...r])];
    const dws=XLSX.utils.aoa_to_sheet(dupRows);
    const dwb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(dwb,dws,"Duplicate Records");
    const filename="Duplicate_Records_"+new Date().toISOString().slice(0,10)+".xlsx";
    XLSX.writeFile(dwb,filename);
    alert(`Import successful!\n\nAdded: ${added}\nDuplicate: ${skipped}\nEmpty rows: ${empty}\n\nDuplicate records ka Excel automatically download ho gaya hai.`);
  }else{
    alert(`Import successful!\n\nAdded: ${added}\nDuplicate: 0\nEmpty rows: ${empty}`);
  }
 }catch(err){console.error(err);alert("Import nahi hua.\n\nError: "+err.message);status("Import failed • "+err.message)}
 finally{e.target.value=""}
}
