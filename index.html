<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;font-size:14px;background:#f5f7fb;color:#172033}
header{background:#17365d;color:#fff;padding:16px 22px}header h1{margin:0;font-size:20px}
.wrap{padding:18px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#fff;border-radius:9px;padding:14px 20px;box-shadow:0 2px 8px #0001;min-width:155px}.num{font-size:22px;font-weight:700}
.panel,.tablebox{background:#fff;border-radius:9px;box-shadow:0 2px 8px #0001;margin-top:14px;padding:14px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px}
label{font-size:12px;color:#475569}input,select,button{font:inherit;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px}label>input,label>select{display:block;width:100%;margin-top:4px}
button{cursor:pointer;background:#17365d;color:#fff;border:0}.green{background:#198754}.gray{background:#64748b}.red{background:#dc3545}.blue{background:#1769d1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font-size:13px;margin-top:9px;color:#475569}
.dd{position:relative;margin-top:4px}.dropbtn{display:block;width:100%;background:#fff;color:#172033;border:1px solid #cbd5e1;text-align:left}
.ddmenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid #cbd5e1;border-radius:6px;box-shadow:0 5px 16px #0002;z-index:100;max-height:270px;overflow:auto;padding:5px}
.ddmenu.show{display:block}.ddsearch{width:100%!important;margin:0 0 5px!important}.dditem{display:flex;gap:7px;align-items:center;padding:6px;cursor:pointer}.dditem.selected{background:#e8f0fe}.ddmenu button.dditem{width:100%;background:#fff;color:#172033;border:0;text-align:left}.ddmenu button.dditem:hover{background:#eef4fb}.dditem input{width:auto!important;margin:0!important}
table{border-collapse:collapse;width:100%;min-width:1900px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-align:left}th{background:#eaf0f7;position:sticky;top:0}
.tablebox{overflow-x:hidden;overflow-y:visible}td[contenteditable=true]{background:#fffef4}
.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;z-index:200}.modal.show{display:flex}.box{background:#fff;border-radius:10px;padding:20px;width:min(850px,94vw);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.filters,.form{grid-template-columns:1fr 1fr}}@media(max-width:600px){.filters,.form{grid-template-columns:1fr}}

.filter-toggle{font-size:20px;font-weight:700;line-height:1;padding:6px 13px;min-width:38px}
#filterContent{transition:none}
#filterContent.hidden{display:none}
.filter-toggle{position:absolute;right:12px;top:10px;font-size:20px;font-weight:700;line-height:1;padding:5px 12px;min-width:38px}
.panel{position:relative}

.download-card{min-width:180px}
.download-title{font-size:13px;margin-bottom:7px;color:#334155}
.download-buttons{display:flex;gap:7px}
.download-buttons button{padding:7px 14px;font-size:13px}

.bottom-scroll-wrap{margin:4px 0 14px;background:#fff;border-radius:6px;padding:4px 0;box-shadow:0 1px 4px #0001}
.bottom-scroll{height:16px;overflow-x:auto;overflow-y:hidden;cursor:pointer}
#bottomScrollInner{height:1px}
.tablebox td{padding:3px 7px;font-size:12px;line-height:1.15;white-space:nowrap}
.tablebox tbody tr{height:27px}
.tablebox tbody td{height:27px;box-sizing:border-box}
.tablebox{overflow-x:hidden;overflow-y:visible;scrollbar-width:none;-ms-overflow-style:none}.tablebox::-webkit-scrollbar{display:none}
.bottom-scroll-wrap{margin:3px 0 12px;background:#fff;border-radius:5px;padding:3px 0;box-shadow:0 1px 3px #0001}
.bottom-scroll{height:15px;overflow-x:auto;overflow-y:hidden;cursor:pointer}
#bottomScrollInner{height:1px}
</style>

<body>
<header><h1>Student Medical Data <span style="font-size:12px;opacity:.8">Online V3</span></h1></header>
<div class="wrap">
<div class="cards">
<div class="card">Total Records<div class="num" id="total">0</div></div>
<div class="card">States<div class="num" id="states">0</div></div>
<div class="card">Institutes<div class="num" id="institutes">0</div></div>
<div class="card">Courses<div class="num" id="courses">0</div></div>
<div class="card download-card">
  <div class="download-title">Download</div>
  <div class="download-buttons">
    <button type="button" class="blue" onclick="exportFilteredExcel()">Excel</button>
    <button type="button" class="red" onclick="exportFilteredPDF()">PDF</button>
  </div>
</div>
</div>

<div class="panel">
<div id="filterContent">
<div class="filters" id="filterPanel">
<label>Year<select id="year" onchange="render()"><option value="">All Years</option></select></label>
<label>State (Multiple)<div class="dd"><button class="dropbtn" onclick="toggleDD('stateMenu')">All States ▾</button><div class="ddmenu" id="stateMenu"></div></div></label>
<label>Institute Type (Multiple)<div class="dd"><button class="dropbtn" onclick="toggleDD('typeMenu')">All Types ▾</button><div class="ddmenu" id="typeMenu"></div></div></label>
<label>Institute Name<div class="dd"><button class="dropbtn" onclick="toggleDD('instituteMenu')">All Institutes ▾</button><div class="ddmenu" id="instituteMenu"></div></div></label>
<label>Location<div class="dd"><button class="dropbtn" onclick="toggleDD('locationMenu')">All Locations ▾</button><div class="ddmenu" id="locationMenu"></div></div></label>
<label>Course Name<div class="dd"><button class="dropbtn" onclick="toggleDD('courseMenu')">All Courses ▾</button><div class="ddmenu" id="courseMenu"></div></div></label>
<label>Category (Multiple)<div class="dd"><button class="dropbtn" onclick="toggleDD('categoryMenu')">All Categories ▾</button><div class="ddmenu" id="categoryMenu"></div></div></label>
<label>Round (Multiple)<div class="dd"><button class="dropbtn" onclick="toggleDD('roundMenu')">All Rounds ▾</button><div class="ddmenu" id="roundMenu"></div></div></label>
<label>Closing Rank ≤<input id="rank" type="number" step="any" oninput="render()"></label>
<label>Closing Score ≤<input id="score" type="number" step="any" oninput="render()"></label>
<label>Fee Sort<select id="feeSort" onchange="render()"><option value="">No sorting</option><option value="asc">Total Fee: Low → High</option><option value="desc">Total Fee: High → Low</option></select></label>
</div>
<div class="btns">
<button onclick="openAdd()">+ Add Record</button>
<button class="green" onclick="document.getElementById('file').click()">Import Excel</button>

<button onclick="exportExcel()">Export All Excel</button>

<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden onchange="importExcel(event)">
</div>
<div class="status" id="status">Ready • HTML Only V21</div>
</div>
<button type="button" class="gray filter-toggle" onclick="toggleFilters()" id="filterToggle">−</button>
</div>

<div class="tablebox" id="tableBox"><table id="dataTable"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="bottom-scroll-wrap" id="bottomScrollWrap">
  <div class="bottom-scroll" id="bottomScroll"><div id="bottomScrollInner"></div></div>
</div>
</div>

<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Add Record</h2><div class="form" id="form"></div><div class="btns"><button onclick="saveForm()">Save</button><button class="gray" onclick="closeModal()">Cancel</button></div></div></div>

<script>
const HEADERS=["S.No.","Year","State","Inst. Type","Institute Name","Location","Estd.","Course Name","Category","Closing Rank","Closing Score","Round","Annual Fee (₹)","Other Fee (₹)","Total Fee (₹)","Fee 1st year pa","NRI Fee (₹)"];
const DB_NAME="StudentMedicalDataHTMLOnly",STORE="records",DB_VERSION=1;
let data=[],editIndex=-1;
let filters={state:[],type:[],category:[],round:[],institute:"",location:"",course:""};
const cfg={
 stateMenu:{col:2,label:"All States",multi:true,key:"state"},
 typeMenu:{col:3,label:"All Types",multi:true,key:"type"},
 instituteMenu:{col:4,label:"All Institutes",multi:false,key:"institute"},
 locationMenu:{col:5,label:"All Locations",multi:false,key:"location"},
 courseMenu:{col:7,label:"All Courses",multi:false,key:"course"},
 categoryMenu:{col:8,label:"All Categories",multi:true,key:"category"},
 roundMenu:{col:11,label:"All Rounds",multi:true,key:"round"}
};
const SUPABASE_URL="https://tyjdyntcbwsikhcafkhj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_WhR0Jef1IvrkbSgq2ymbqw_F_qZpF1M";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

function rowToObject(r){
 return {s_no:r[0]??"",year:r[1]??"",state:r[2]??"",inst_type:r[3]??"",institute_name:r[4]??"",location:r[5]??"",estd:r[6]??"",course_name:r[7]??"",category:r[8]??"",closing_rank:num(r[9]),closing_score:num(r[10]),round:r[11]??"",annual_fee:num(r[12]),other_fee:num(r[13]),total_fee:num(r[14]),fee_1st_year_pa:num(r[15]),nri_fee:num(r[16])};
}
function objectToRow(o){return[o.s_no??"",o.year??"",o.state??"",o.inst_type??"",o.institute_name??"",o.location??"",o.estd??"",o.course_name??"",o.category??"",o.closing_rank??"",o.closing_score??"",o.round??"",o.annual_fee??"",o.other_fee??"",o.total_fee??"",o.fee_1st_year_pa??"",o.nri_fee??""]}

async function getSupabaseRows(){
 const {data:rows,error}=await supabaseClient.from("medical_data").select("*");
 if(error)throw error;
 return(rows||[]).map(objectToRow);
}
async function uploadRows(rows){
 if(!rows.length)return;
 const {error}=await supabaseClient.from("medical_data").insert(rows.map(rowToObject));
 if(error)throw error;
}
async function replaceSupabaseRows(rows){
 const {error}=await supabaseClient.from("medical_data").delete().not("id","is",null);
 if(error)throw error;
 await uploadRows(rows);
}
async function syncCurrentData(){
 await replaceSupabaseRows(data);
 await replaceDB();
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(v){return String(v??"").trim().toLowerCase()}
function num(v){if(String(v??"").trim()==="")return null;const n=Number(String(v).replace(/[₹,\s]/g,""));return Number.isFinite(n)?n:null}
function unique(c){return [...new Set(data.map(r=>String(r[c]??"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))}

function db(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VERSION);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:"id"})};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
async function loadDB(){
 try{
  const remote=await getSupabaseRows();
  if(remote.length){
   data=remote;await replaceDB();refreshMenus();render();
   status(`Loaded ${data.length} records from Supabase`);
   return;
  }

  const d=await db();
  const localRows=await new Promise((res,rej)=>{
   const q=d.transaction(STORE,"readonly").objectStore(STORE).getAll();
   q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
  });
  d.close();
  const localData=localRows.sort((a,b)=>a.id-b.id).map(x=>x.row);

  if(localData.length){
   data=localData;
   await uploadRows(data);
   refreshMenus();render();
   status(`Migrated ${data.length} records to Supabase`);
  }else{
   data=[];refreshMenus();render();status("Supabase connected • 0 records");
  }
 }catch(e){
  console.error(e);
  try{
   const d=await db();
   const rows=await new Promise((res,rej)=>{
    const q=d.transaction(STORE,"readonly").objectStore(STORE).getAll();
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
   });
   d.close();data=rows.sort((a,b)=>a.id-b.id).map(x=>x.row);
   refreshMenus();render();
   status(`Loaded ${data.length} local records • Supabase error`);
  }catch(_){
   data=[];refreshMenus();render();status("Supabase connection failed");
  }
 }
}

async function saveDB(){
 const d=await db();await new Promise((res,rej)=>{const s=d.transaction(STORE,"readwrite").objectStore(STORE);s.clear().onsuccess=()=>{data.forEach((row,i)=>s.put({id:i+1,row}));};d.onversionchange=()=>d.close();const tx=d.transaction;setTimeout(res,50)}).catch(()=>{});d.close();status(`Saved ${data.length} records`);
}
async function replaceDB(){const d=await db();const tx=d.transaction(STORE,"readwrite"),s=tx.objectStore(STORE);s.clear();data.forEach((row,i)=>s.put({id:i+1,row}));await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});d.close()}

function status(t){const x=document.getElementById("status");if(x)x.textContent=t}

function rowsForOptions(excludeKey){
 const y=norm(document.getElementById("year").value);
 const rank=num(document.getElementById("rank").value);
 const score=num(document.getElementById("score").value);
 return data.filter(r=>{
   const rr=num(r[8]),ss=num(r[9]);
   return (!y||norm(r[0])===y)
    &&(excludeKey==="state"||!filters.state.length||filters.state.includes(norm(r[1])))
    &&(excludeKey==="type"||!filters.type.length||filters.type.includes(norm(r[2])))
    &&(excludeKey==="institute"||!filters.institute||norm(r[3])===norm(filters.institute))
    &&(excludeKey==="location"||!filters.location||norm(r[4])===norm(filters.location))
    &&(excludeKey==="course"||!filters.course||norm(r[6])===norm(filters.course))
    &&(excludeKey==="category"||!filters.category.length||filters.category.includes(norm(r[7])))
    &&(excludeKey==="round"||!filters.round.length||filters.round.includes(norm(r[10])))
    &&(rank===null||(rr!==null&&rr<=rank))
    &&(score===null||(ss!==null&&ss<=score));
 });
}
function optionValues(col,excludeKey){
 return [...new Set(rowsForOptions(excludeKey).map(r=>String(r[col]??"").trim()).filter(Boolean))]
   .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
}
function setupMenu(id){
 const c=cfg[id],m=document.getElementById(id),q=norm(m.dataset.q||"");
 const old=c.multi?(filters[c.key]||[]):norm(filters[c.key]||"");
 let h=`<input class="ddsearch" placeholder="Search..." value="${esc(m.dataset.q||"")}" oninput="searchMenu('${id}',this.value)">`;
 if(c.multi)h+=`<label class="dditem"><input type="checkbox" ${old.length===0?"checked":""} onclick="event.stopPropagation()" onchange="selectMulti('${c.key}','',this.checked)"> All</label>`;
 optionValues(c.col,c.key).filter(v=>!q||norm(v).includes(q)).forEach(v=>{
   if(c.multi){
     const val=esc(norm(v)).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
     h+=`<label class="dditem"><input type="checkbox" value="${esc(v)}" ${old.includes(norm(v))?"checked":""} onclick="event.stopPropagation()" onchange="selectMulti('${c.key}',this.dataset.val,this.checked)" data-val="${val}">${esc(v)}</label>`;
   }else{
     const val=esc(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
     h+=`<button type="button" class="dditem ${norm(old)===norm(v)?"selected":""}" data-value="${val}" onclick="chooseSingle('${id}','${c.key}',this.dataset.value);event.stopPropagation()">${esc(v)}</button>`;
   }
 });
 m.innerHTML=h;
 const b=m.parentElement.querySelector(".dropbtn");
 if(c.multi){
   if(!old.length){
     b.textContent=c.label+" ▾";
   }else{
     const names=old.map(v=>{
       const found=optionValues(c.col,c.key).find(x=>norm(x)===norm(v));
       return found||v;
     });
     b.textContent=names.join(", ")+" ▾";
   }
 }else{
   b.textContent=(old||c.label)+" ▾";
 }
}
function openMenu(id){
 const m=document.getElementById(id);
 if(!m)return;
 document.querySelectorAll(".ddmenu.show").forEach(x=>{if(x.id!==id)x.classList.remove("show")});
 m.classList.toggle("show");
 if(m.classList.contains("show"))setupMenu(id);
}
function toggleDD(id){openMenu(id)}
function searchMenu(id,q){
 const m=document.getElementById(id);
 m.dataset.q=q;
 setupMenu(id);
 m.classList.add("show");
 const inp=m.querySelector(".ddsearch");
 if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}
function chooseSingle(id,k,v){
 filters[k]=String(v||"");
 const m=document.getElementById(id);
 m.classList.remove("show");
 m.dataset.q="";
 refreshMenus();
 render();
}
function selectMulti(k,v,on){
 if(v===""){
   if(on)filters[k]=[];
 }else{
   let a=Array.isArray(filters[k])?filters[k]:[];
   if(on&&!a.includes(v))a.push(v);
   if(!on)a=a.filter(x=>x!==v);
   filters[k]=a;
 }
 refreshMenus();
 render();
}
document.addEventListener("click",e=>{
 if(!e.target.closest(".dd"))document.querySelectorAll(".ddmenu.show").forEach(x=>x.classList.remove("show"));
});


function getFilteredRows(){
 const y=norm(document.getElementById("year").value);
 const rank=num(document.getElementById("rank").value);
 const score=num(document.getElementById("score").value);
 let rows=data.map((r,i)=>({r,i})).filter(x=>{
   const r=x.r,rr=num(r[8]),ss=num(r[9]);
   return (!y||norm(r[0])===y)
    &&(!filters.state.length||filters.state.includes(norm(r[1])))
    &&(!filters.type.length||filters.type.includes(norm(r[2])))
    &&(!filters.institute||norm(r[3])===norm(filters.institute))
    &&(!filters.location||norm(r[4])===norm(filters.location))
    &&(!filters.course||norm(r[6])===norm(filters.course))
    &&(!filters.category.length||filters.category.includes(norm(r[7])))
    &&(!filters.round.length||filters.round.includes(norm(r[10])))
    &&(rank===null||(rr!==null&&rr<=rank))
    &&(score===null||(ss!==null&&ss<=score));
 });
 const fs=document.getElementById("feeSort").value;
 if(fs)rows.sort((a,b)=>{
   const av=num(a.r[13]),bv=num(b.r[13]);
   const aa=av===null?Infinity:av,bb=bv===null?Infinity:bv;
   return (aa-bb)*(fs==="asc"?1:-1);
 });
 return rows;
}
function render(){
 const y=norm(document.getElementById("year").value);
 const rank=num(document.getElementById("rank").value);
 const score=num(document.getElementById("score").value);

 let rows=data.map((r,i)=>({r,i})).filter(x=>{
   const r=x.r;
   const rr=num(r[9]), ss=num(r[10]);
   return (!y||norm(r[1])===y)
    &&(!filters.state.length||filters.state.includes(norm(r[2])))
    &&(!filters.type.length||filters.type.includes(norm(r[3])))
    &&(!filters.institute||norm(r[4])===norm(filters.institute))
    &&(!filters.location||norm(r[5])===norm(filters.location))
    &&(!filters.course||norm(r[7])===norm(filters.course))
    &&(!filters.category.length||filters.category.includes(norm(r[8])))
    &&(!filters.round.length||filters.round.includes(norm(r[11])))
    &&(rank===null||(rr!==null&&rr<=rank))
    &&(score===null||(ss!==null&&ss<=score));
 });

 const fs=document.getElementById("feeSort").value;
 if(fs)rows.sort((a,b)=>{
   const av=num(a.r[14]),bv=num(b.r[14]);
   const aa=av===null?Infinity:av,bb=bv===null?Infinity:bv;
   return (aa-bb)*(fs==="asc"?1:-1);
 });

 document.getElementById("total").textContent=data.length;
 document.getElementById("states").textContent=new Set(data.map(r=>norm(r[2])).filter(Boolean)).size;
 document.getElementById("institutes").textContent=new Set(data.map(r=>norm(r[4])).filter(Boolean)).size;
 document.getElementById("courses").textContent=new Set(data.map(r=>norm(r[7])).filter(Boolean)).size;

 const year=document.getElementById("year"),oldYear=y;
 year.innerHTML='<option value="">All Years</option>'+unique(1).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
 year.value=[...year.options].some(o=>norm(o.value)===oldYear)?oldYear:"";

 document.getElementById("thead").innerHTML=HEADERS.map(h=>`<th>${esc(h)}</th>`).join("");
 document.getElementById("tbody").innerHTML=rows.map(x=>
   `<tr><td>${x.i+1}</td>`+
   x.r.slice(1).map((v,j)=>`<td contenteditable="true" onblur="editCell(${x.i},${j+1},this.textContent)">${esc(v)}</td>`).join("")+
   `<td><button class="blue" onclick="openEdit(${x.i})">Edit</button> <button class="red" onclick="deleteRow(${x.i})">Delete</button></td></tr>`
 ).join("");

 status(`Showing ${rows.length} of ${data.length} records`);
 setTimeout(syncBottomScroller,0);
}
function refreshMenus(){
 Object.keys(cfg).forEach(id=>{
   const m=document.getElementById(id);
   m.dataset.q="";
   setupMenu(id);
 });
}
function resetFilters(){
 filters={state:[],type:[],category:[],round:[],institute:"",location:"",course:""};
 document.getElementById("rank").value="";
 document.getElementById("score").value="";
 document.getElementById("feeSort").value="";
 document.getElementById("year").value="";
 Object.keys(cfg).forEach(id=>{
   const m=document.getElementById(id);m.dataset.q="";m.classList.remove("show");
 });
 refreshMenus();render();
}
function clean(r){r=r.slice(0,16);while(r.length<16)r.push("");return r.map((v,i)=>(i===9||i===10)?(String(v).trim()===""?"":(num(v)??String(v).trim())):String(v??"").trim())}
function buildForm(r=[]){document.getElementById("form").innerHTML=HEADERS.slice(1).map((h,j)=>`<label>${esc(h)}<input id="f${j}" ${j===8||j===9?'type="number" step="any"':''} value="${esc(r[j+1]??"")}"></label>`).join("")}
function openAdd(){editIndex=-1;document.getElementById("modalTitle").textContent="Add Record";buildForm();document.getElementById("modal").classList.add("show")}
function openEdit(i){editIndex=i;document.getElementById("modalTitle").textContent="Edit Record";buildForm(data[i]);document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
async function saveForm(){let r=clean(HEADERS.slice(1).map((_,j)=>document.getElementById("f"+j).value));if(editIndex<0)data.push(r);else data[editIndex]=r;try{await syncCurrentData();closeModal();render();status(`Saved ${data.length} records to Supabase`)}catch(e){alert("Supabase save failed.\\n\\n"+e.message)}}
async function editCell(i,j,v){data[i][j]=(j===8||j===9)?(num(v)??String(v).trim()):String(v??"").trim();try{await syncCurrentData();render()}catch(e){alert("Supabase update failed.\\n\\n"+e.message)}}
async function deleteRow(i){if(confirm("Delete this record?")){data.splice(i,1);try{await syncCurrentData();render()}catch(e){alert("Supabase delete failed.\\n\\n"+e.message)}}}

function exportFilteredPDF(){
 if(!window.jspdf){alert("PDF module load nahi hua. Internet ON karke page refresh karein.");return}
 const rows=getFilteredRows();
 if(!rows.length){alert("Filtered data mein koi record nahi hai.");return}
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a3"});
 const margin=8, pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
 const usableW=pageW-margin*2;
 const widths=[9,14,13,18,34,20,13,22,18,20,20,13,24,22,22,22,22];
 const total=widths.reduce((a,b)=>a+b,0), scale=usableW/total;
 const ws=widths.map(w=>w*scale);
 let y=15, page=1;
 const title="Student Medical Data — Filtered Records";
 function drawHeader(){
   doc.setFontSize(13);doc.setFont(undefined,"bold");doc.text(title,margin,y);y+=7;
   doc.setFontSize(6.5);
   let x=margin;
   HEADERS.forEach((h,i)=>{doc.rect(x,y,ws[i],8);doc.text(String(h),x+1,y+3,{maxWidth:ws[i]-2});x+=ws[i]});
   y+=8;
 }
 function drawPageFooter(){
   doc.setFontSize(7);doc.setFont(undefined,"normal");
   doc.text(`Page ${page}`,pageW-margin, pageH-5,{align:"right"});
 }
 drawHeader();
 rows.forEach((item,ri)=>{
   const vals=[ri+1,...item.r].map(v=>String(v??""));
   const lineH=7;
   if(y+lineH>pageH-10){drawPageFooter();doc.addPage();page++;y=15;drawHeader()}
   let x=margin;doc.setFontSize(5.5);doc.setFont(undefined,"normal");
   vals.forEach((v,i)=>{
     doc.rect(x,y,ws[i],lineH);
     const words=v.split(/\s+/);let line="",lines=[];
     words.forEach(word=>{
       const test=line?line+" "+word:word;
       if(doc.getTextWidth(test)>ws[i]-2){if(line)lines.push(line);line=word}else line=test;
     });
     if(line)lines.push(line);
     lines.slice(0,2).forEach((ln,n)=>doc.text(ln,x+1,y+3+n*2.5,{maxWidth:ws[i]-2}));
     x+=ws[i];
   });
   y+=lineH;
 });
 drawPageFooter();
 doc.save("Student_Medical_Data_Filtered.pdf");
 status(`Filtered PDF downloaded • ${rows.length} records`);
}

async function importExcel(e){
 const f=e.target.files[0];if(!f)return;
 try{
  if(typeof XLSX==="undefined")throw new Error("Excel module load nahi hua. Internet ON karke page refresh karein.");
  status("Importing Excel...");
  const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:"array",cellText:true,cellDates:false}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
  if(!rows.length)throw new Error("Excel file empty hai.");
  const cleanH=v=>norm(v).replace(/₹/g,"").replace(/[()._-]/g,"").replace(/\s+/g,"");
  const aliases={
   0:["year"],1:["state"],2:["insttype","institutetype"],3:["institutename","collegename"],
   4:["location","city"],5:["estd","established"],6:["coursename","course"],7:["category"],
   8:["closingrank","rank"],9:["closingscore","score"],10:["round"],11:["annualfee"],
   12:["otherfee"],13:["totalfee"],14:["fee1styearpa","fee1styear","firstyearfee"],15:["nrifee"]
  };
  let hi=-1,map=Array(16).fill(-1);
  for(let i=0;i<Math.min(rows.length,15);i++){
   const hs=rows[i].map(cleanH);
   if(hs.includes("year")&&hs.some(x=>x==="institutename")&&hs.some(x=>x==="coursename")){
    hi=i;
    Object.keys(aliases).forEach(j=>{map[j]=hs.findIndex(x=>aliases[j].includes(x))});
    break;
   }
  }
  if(hi<0){hi=0;if(rows[0].length>=17)for(let j=0;j<16;j++)map[j]=j+1;else if(rows[0].length>=16)for(let j=0;j<16;j++)map[j]=j;else throw new Error("16/17 columns nahi mile.");}
  let added=0,skipped=0,empty=0;
  const duplicateRows=[];
  for(let i=hi+1;i<rows.length;i++){
   const r=clean(map.map(k=>k>=0?rows[i][k]:""));
   if(!r.some(v=>String(v).trim())){empty++;continue}
   const duplicateKey = r.slice(0,10).map(norm).join("|");
   const dup = data.some(x=>x.slice(0,10).map(norm).join("|")===duplicateKey);
   if(dup){
     skipped++;
     duplicateRows.push(r);
     continue;
   }
   data.push(r);added++;
  }
  if(added) await uploadRows(data.slice(data.length-added));
   await replaceDB();refreshMenus();render();
  status(`Import successful • ${added} added • ${skipped} duplicates`);
  if(duplicateRows.length){
    const dupRows=[HEADERS,...duplicateRows.map((r,i)=>[i+1,...r])];
    const dws=XLSX.utils.aoa_to_sheet(dupRows);
    const dwb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(dwb,dws,"Duplicate Records");
    const filename="Duplicate_Records_"+new Date().toISOString().slice(0,10)+".xlsx";
    XLSX.writeFile(dwb,filename);
    alert(`Import successful!\n\nAdded: ${added}\nDuplicate: ${skipped}\nEmpty rows: ${empty}\n\nDuplicate records ka Excel automatically download ho gaya hai.`);
  }else{
    alert(`Import successful!\n\nAdded: ${added}\nDuplicate: 0\nEmpty rows: ${empty}`);
  }
 }catch(err){console.error(err);alert("Import nahi hua.\n\nError: "+err.message);status("Import failed")}
 finally{e.target.value=""}
}

let filtersHidden=false;
function toggleFilters(){
 filtersHidden=!filtersHidden;
 const panel=document.getElementById("filterContent");
 const btn=document.getElementById("filterToggle");
 panel.classList.toggle("hidden",filtersHidden);
 btn.textContent=filtersHidden?"+":"−";
}

function syncBottomScroller(){
 const box=document.getElementById("tableBox");
 const scroll=document.getElementById("bottomScroll");
 const inner=document.getElementById("bottomScrollInner");
 const table=document.getElementById("dataTable");
 if(!box||!scroll||!inner||!table)return;
 inner.style.width=table.scrollWidth+"px";
 scroll.scrollLeft=box.scrollLeft;
 scroll.onscroll=()=>{box.scrollLeft=scroll.scrollLeft};
 box.onscroll=()=>{scroll.scrollLeft=box.scrollLeft};
}
window.addEventListener("resize",syncBottomScroller);
loadDB();
